[project]
name = "swarm-agent-kit"
version = "0.2.0"
description = "A minimalist, state-aware multi-agent orchestration framework."
license = { text = "MIT" }
authors = [
    { name = "Moseleydev", email = "moseleydev7@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["llm", "agents", "multi-agent", "orchestration", "litellm", "ai", "swarm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0.0",
    "litellm>=1.0.0",
    "python-dotenv>=1.2.4",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
]

[project.urls]
Homepage = "https://github.com/moseleydev/swarm-kit"
Documentation = "https://moseleydev.github.io/swarm-kit/"
Repository = "https://github.com/moseleydev/swarm-kit"
Issues = "https://github.com/moseleydev/swarm-kit/issues"
Changelog = "https://github.com/moseleydev/swarm-kit/blob/main/CHANGELOG.md"

[project.scripts]
swarm-kit = "swarm_kit.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swarm_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = ["site"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP006", "UP007", "UP035", "UP045", "B008"]

[tool.ruff.lint.per-file-ignores]
"src/swarm_kit/ui/server.py" = ["E501"]
